<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Endless Runner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
      touch-action: none;
    }
    canvas {
      display: block;
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(100, 200, 255, 0.2);
    }
    #ui {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// Responsive sizing
function resize() {
  const maxW = Math.min(window.innerWidth, 800);
  const maxH = Math.min(window.innerHeight, 450);
  const ratio = 16 / 9;
  let w = maxW, h = w / ratio;
  if (h > maxH) { h = maxH; w = h * ratio; }
  canvas.width = Math.floor(w);
  canvas.height = Math.floor(h);
  GROUND = canvas.height * 0.78;
}
window.addEventListener('resize', () => { resize(); });
resize();

let GROUND;
resize();

// --- Palette ---
const C = {
  sky1: '#0f0c29', sky2: '#302b63',
  ground: '#16213e', groundTop: '#0f3460',
  player: '#e94560', playerEye: '#fff',
  platform: '#0f3460', platformTop: '#1a4a7a',
  obstacle: '#e94560',
  coin: '#ffd700',
  coinShine: '#fff8',
  star: '#ffffff',
  hud: '#ffffff',
  shadow: 'rgba(0,0,0,0.4)',
};

// --- Stars ---
const stars = Array.from({length: 80}, () => ({
  x: Math.random(), y: Math.random() * 0.7,
  r: Math.random() * 1.5 + 0.3,
  twinkle: Math.random() * Math.PI * 2,
}));

// --- Game State ---
let state = 'start'; // 'start' | 'play' | 'dead'
let score = 0, coins = 0, hiScore = 0, bestCoins = 0;
let speed = 0, baseSpeed = 0, frame = 0;
let particles = [];

// --- Player ---
const player = {
  x: 0, y: 0, vy: 0,
  w: 0, h: 0,
  onGround: false,
  onPlatform: false,
  jumpCount: 0,
  maxJumps: 2,
  squish: 1,       // y scale for squash/stretch
  tilt: 0,         // rotation
  trail: [],
  dead: false,
};

function initPlayer() {
  player.w = canvas.width * 0.045;
  player.h = canvas.width * 0.055;
  player.x = canvas.width * 0.15;
  player.y = GROUND - player.h;
  player.vy = 0;
  player.onGround = true;
  player.onPlatform = false;
  player.jumpCount = 0;
  player.squish = 1;
  player.tilt = 0;
  player.trail = [];
  player.dead = false;
}

// --- Physics ---
const GRAVITY = () => canvas.height * 0.032;
const JUMP_V  = () => -canvas.height * 0.068;

function jump() {
  if (state === 'start') { startGame(); return; }
  if (state === 'dead')  { startGame(); return; }
  if (player.dead) return;
  if (player.jumpCount < player.maxJumps) {
    player.vy = JUMP_V();
    player.jumpCount++;
    player.squish = 1.3;
    spawnJumpParticles();
    // Double-jump extra burst
    if (player.jumpCount === 2) spawnJumpParticles(true);
  }
}

// --- Input ---
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault(); jump();
  }
});
canvas.addEventListener('pointerdown', e => { e.preventDefault(); jump(); });

// --- World Objects ---
let platforms = [], obstacles = [], coinItems = [];

function W(v) { return v * canvas.width; }
function H(v) { return v * canvas.height; }

function spawnPlatform() {
  const pw = W(0.12 + Math.random() * 0.14);
  const ph = H(0.04);
  const py = GROUND - H(0.12 + Math.random() * 0.28);
  platforms.push({ x: W(1.05), y: py, w: pw, h: ph, coin: Math.random() < 0.7 });
}

function spawnObstacle() {
  const types = ['cactus', 'spike', 'block'];
  const t = types[Math.floor(Math.random() * types.length)];
  const bw = W(0.025 + Math.random() * 0.02);
  const bh = H(0.04 + Math.random() * 0.05);
  obstacles.push({ x: W(1.05), y: GROUND - bh, w: bw, h: bh, type: t });
}

function spawnCoin(x, y) {
  coinItems.push({ x, y, w: W(0.022), h: W(0.022), anim: Math.random() * Math.PI * 2, collected: false });
}

// --- Particles ---
function spawnJumpParticles(big = false) {
  for (let i = 0; i < (big ? 12 : 6); i++) {
    const angle = Math.PI + (Math.random() - 0.5) * Math.PI;
    const spd = (big ? 3 : 1.5) + Math.random() * 2;
    particles.push({
      x: player.x + player.w / 2,
      y: player.y + player.h,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd - 1,
      life: 1, maxLife: 1,
      r: W(0.006) * (big ? 1.5 : 1),
      color: big ? '#a78bfa' : '#60a5fa',
    });
  }
}

function spawnCoinParticles(x, y) {
  for (let i = 0; i < 10; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 1.5 + Math.random() * 2.5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd - 2,
      life: 1, maxLife: 1,
      r: W(0.004),
      color: '#ffd700',
    });
  }
}

function spawnDeathParticles() {
  for (let i = 0; i < 20; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 2 + Math.random() * 4;
    particles.push({
      x: player.x + player.w / 2,
      y: player.y + player.h / 2,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd - 3,
      life: 1, maxLife: 1,
      r: W(0.008),
      color: '#e94560',
    });
  }
}

// --- Spawn Timers ---
let spawnTimer = 0, coinTimer = 0;

function getSpawnInterval() {
  // Decrease interval as speed increases
  return Math.max(60, 140 - score * 0.4);
}

// --- Init/Start ---
function startGame() {
  state = 'play';
  score = 0; coins = 0; frame = 0;
  speed = W(0.004);
  baseSpeed = speed;
  platforms = []; obstacles = []; coinItems = []; particles = [];
  spawnTimer = 80; coinTimer = 120;
  initPlayer();
}

// --- Collision (AABB with margin) ---
function aabb(a, b, margin = 0) {
  return a.x + margin < b.x + b.w &&
         a.x + a.w - margin > b.x &&
         a.y + margin < b.y + b.h &&
         a.y + a.h - margin > b.y;
}

// --- Update ---
function update() {
  if (state !== 'play') return;

  frame++;
  score++;
  speed = W(0.004) + score * W(0.000008);

  // Stars drift
  stars.forEach(s => { s.twinkle += 0.02; });

  // Player trail
  player.trail.unshift({ x: player.x + player.w / 2, y: player.y + player.h / 2 });
  if (player.trail.length > 8) player.trail.pop();

  // Gravity
  if (!player.dead) {
    player.vy += GRAVITY();
    player.y += player.vy;
  }

  // Ground collision
  if (player.y + player.h >= GROUND) {
    player.y = GROUND - player.h;
    player.vy = 0;
    player.onGround = true;
    player.jumpCount = 0;
    player.squish = 0.75; // squash on land
  } else {
    player.onGround = false;
  }

  // Squish recovery
  player.squish += (1 - player.squish) * 0.2;

  // Tilt while airborne
  if (!player.onGround && !player.onPlatform) {
    player.tilt = Math.min(0.3, player.tilt + 0.015) * (player.vy > 0 ? 1 : -0.5);
  } else {
    player.tilt *= 0.7;
  }

  // Platform collision
  player.onPlatform = false;
  platforms.forEach(p => {
    // Only snap on top
    if (player.vy >= 0 &&
        player.x + player.w * 0.8 > p.x &&
        player.x + player.w * 0.2 < p.x + p.w &&
        player.y + player.h > p.y &&
        player.y + player.h < p.y + p.h + speed * 2) {
      player.y = p.y - player.h;
      player.vy = 0;
      player.onPlatform = true;
      player.jumpCount = 0;
      player.squish = 0.8;
    }
  });

  // Spawn obstacles
  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnObstacle();
    // Sometimes add a platform near the obstacle
    if (Math.random() < 0.5) spawnPlatform();
    spawnTimer = getSpawnInterval() + Math.random() * 40;
  }

  // Spawn coins
  coinTimer--;
  if (coinTimer <= 0) {
    // Coins on ground or floating
    const cx = W(1.05) + Math.random() * W(0.1);
    const baseY = Math.random() < 0.4 ? GROUND - W(0.03) : GROUND - H(0.18 + Math.random() * 0.25);
    for (let i = 0; i < Math.floor(Math.random() * 4) + 1; i++) {
      spawnCoin(cx + i * W(0.04), baseY);
    }
    coinTimer = 80 + Math.random() * 60;
  }

  // Move & cleanup platforms
  platforms = platforms.filter(p => {
    p.x -= speed;
    return p.x + p.w > -W(0.1);
  });

  // Move & cleanup obstacles + collision
  obstacles = obstacles.filter(o => {
    o.x -= speed;
    if (!player.dead && aabb(player, o, player.w * 0.15)) {
      die();
    }
    return o.x + o.w > -W(0.1);
  });

  // Move & cleanup coins
  coinItems = coinItems.filter(c => {
    c.x -= speed;
    c.anim += 0.08;
    if (!c.collected && aabb(player, c, -c.w * 0.2)) {
      c.collected = true;
      coins++;
      spawnCoinParticles(c.x + c.w / 2, c.y + c.h / 2);
    }
    return c.x + c.w > -W(0.1) && !c.collected;
  });

  // Particles
  particles = particles.filter(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life -= 0.04;
    return p.life > 0;
  });

  // Death fall
  if (player.dead) {
    player.vy += GRAVITY() * 0.5;
    player.y += player.vy;
    if (player.y > canvas.height + 100) {
      state = 'dead';
      if (score > hiScore) hiScore = score;
      if (coins > bestCoins) bestCoins = coins;
    }
  }
}

function die() {
  if (player.dead) return;
  player.dead = true;
  spawnDeathParticles();
}

// --- Draw Helpers ---
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
}

function drawGradientBg() {
  const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
  g.addColorStop(0, C.sky1);
  g.addColorStop(1, C.sky2);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawStars() {
  stars.forEach(s => {
    const alpha = 0.5 + 0.5 * Math.sin(s.twinkle);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = C.star;
    ctx.beginPath();
    ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawGround() {
  // Ground fill
  ctx.fillStyle = C.ground;
  ctx.fillRect(0, GROUND, canvas.width, canvas.height - GROUND);
  // Ground top line glow
  ctx.shadowColor = '#60a5fa';
  ctx.shadowBlur = 8;
  ctx.fillStyle = C.groundTop;
  ctx.fillRect(0, GROUND, canvas.width, H(0.018));
  ctx.shadowBlur = 0;
}

function drawPlatform(p) {
  ctx.shadowColor = '#1a4a7a';
  ctx.shadowBlur = 10;
  ctx.fillStyle = C.platform;
  roundRect(p.x, p.y, p.w, p.h, 4);
  ctx.fill();
  ctx.fillStyle = C.platformTop;
  roundRect(p.x, p.y, p.w, p.h * 0.4, 4);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawObstacle(o) {
  ctx.shadowColor = '#e94560';
  ctx.shadowBlur = 12;
  if (o.type === 'cactus') {
    // Simple cactus shape
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(o.x + o.w * 0.3, o.y, o.w * 0.4, o.h);
    ctx.fillRect(o.x, o.y + o.h * 0.3, o.w * 0.3, o.h * 0.35);
    ctx.fillRect(o.x + o.w * 0.7, o.y + o.h * 0.2, o.w * 0.3, o.h * 0.35);
    // Spikes
    ctx.fillStyle = '#16a34a';
    ctx.fillRect(o.x + o.w * 0.3, o.y - o.h * 0.1, o.w * 0.4, o.h * 0.15);
  } else if (o.type === 'spike') {
    ctx.fillStyle = '#a78bfa';
    ctx.beginPath();
    ctx.moveTo(o.x, o.y + o.h);
    ctx.lineTo(o.x + o.w / 2, o.y);
    ctx.lineTo(o.x + o.w, o.y + o.h);
    ctx.closePath();
    ctx.fill();
  } else {
    ctx.fillStyle = '#f97316';
    roundRect(o.x, o.y, o.w, o.h, 3);
    ctx.fill();
    // Pattern
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(o.x + o.w * 0.1, o.y + o.h * 0.1, o.w * 0.35, o.h * 0.35);
    ctx.fillRect(o.x + o.w * 0.55, o.y + o.h * 0.55, o.w * 0.35, o.h * 0.35);
  }
  ctx.shadowBlur = 0;
}

function drawCoin(c) {
  const bob = Math.sin(c.anim) * H(0.012);
  const cx = c.x + c.w / 2;
  const cy = c.y + c.h / 2 + bob;
  const r = c.w / 2;

  ctx.shadowColor = '#ffd700';
  ctx.shadowBlur = 14;

  // Coin body
  ctx.fillStyle = C.coin;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  // Inner shine
  ctx.fillStyle = '#ffe87c';
  ctx.beginPath();
  ctx.arc(cx - r * 0.2, cy - r * 0.2, r * 0.55, 0, Math.PI * 2);
  ctx.fill();

  // Shine dot
  ctx.fillStyle = '#fff';
  ctx.globalAlpha = 0.6;
  ctx.beginPath();
  ctx.arc(cx - r * 0.3, cy - r * 0.3, r * 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.shadowBlur = 0;
}

function drawPlayer() {
  // Trail
  player.trail.forEach((t, i) => {
    const alpha = (1 - i / player.trail.length) * 0.15;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = C.player;
    ctx.beginPath();
    ctx.arc(t.x, t.y, player.w * 0.4, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  const cx = player.x + player.w / 2;
  const cy = player.y + player.h / 2;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(player.tilt);
  ctx.scale(1 / player.squish, player.squish);

  // Shadow
  ctx.fillStyle = C.shadow;
  ctx.beginPath();
  ctx.ellipse(0, player.h * 0.52, player.w * 0.5, player.h * 0.08, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body glow
  ctx.shadowColor = C.player;
  ctx.shadowBlur = 16;

  // Body
  ctx.fillStyle = C.player;
  roundRect(-player.w / 2, -player.h / 2, player.w, player.h, player.w * 0.25);
  ctx.fill();

  // Face shine
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  roundRect(-player.w / 2, -player.h / 2, player.w, player.h * 0.45, player.w * 0.25);
  ctx.fill();

  ctx.shadowBlur = 0;

  // Eye
  const eyeX = player.w * 0.15;
  const eyeY = -player.h * 0.1;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(eyeX, eyeY, player.w * 0.18, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(eyeX + player.w * 0.04, eyeY, player.w * 0.1, 0, Math.PI * 2);
  ctx.fill();

  // Mouth
  if (!player.dead) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = player.w * 0.07;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(player.w * 0.05, player.h * 0.15, player.w * 0.18, 0.2, Math.PI - 0.2);
    ctx.stroke();
  } else {
    // X eyes
    ctx.strokeStyle = '#333';
    ctx.lineWidth = player.w * 0.07;
    const ex = player.w * 0.15, ey = -player.h * 0.1, er = player.w * 0.1;
    ctx.beginPath();
    ctx.moveTo(ex - er, ey - er); ctx.lineTo(ex + er, ey + er);
    ctx.moveTo(ex + er, ey - er); ctx.lineTo(ex - er, ey + er);
    ctx.stroke();
  }

  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawHUD() {
  const fs = Math.max(12, canvas.width * 0.025);
  ctx.font = `bold ${fs}px 'Segoe UI', sans-serif`;
  ctx.textBaseline = 'top';

  // Score
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#60a5fa';
  ctx.shadowBlur = 8;
  ctx.fillText(`Score: ${Math.floor(score / 6)}`, W(0.03), H(0.04));

  // Coins
  ctx.fillStyle = '#ffd700';
  ctx.fillText(`Coins: ${coins}`, W(0.03), H(0.04) + fs * 1.4);

  // Hi-score
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.textAlign = 'right';
  ctx.fillText(`Best: ${Math.floor(hiScore / 6)}`, W(0.97), H(0.04));
  ctx.textAlign = 'left';
  ctx.shadowBlur = 0;
}

function drawScreen(title, sub1, sub2) {
  // Overlay
  ctx.fillStyle = 'rgba(15,12,41,0.75)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const bw = W(0.5), bh = H(0.55);
  const bx = (canvas.width - bw) / 2, by = (canvas.height - bh) / 2;

  // Panel
  ctx.fillStyle = 'rgba(48,43,99,0.95)';
  ctx.strokeStyle = '#60a5fa';
  ctx.lineWidth = 2;
  roundRect(bx, by, bw, bh, 16);
  ctx.fill();
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const cx = canvas.width / 2;

  // Title
  ctx.font = `bold ${W(0.065)}px 'Segoe UI', sans-serif`;
  ctx.fillStyle = '#e94560';
  ctx.shadowColor = '#e94560';
  ctx.shadowBlur = 20;
  ctx.fillText(title, cx, by + bh * 0.22);
  ctx.shadowBlur = 0;

  // Sub lines
  ctx.font = `${W(0.033)}px 'Segoe UI', sans-serif`;
  ctx.fillStyle = '#fff';
  ctx.fillText(sub1, cx, by + bh * 0.45);

  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = `${W(0.028)}px 'Segoe UI', sans-serif`;
  ctx.fillText(sub2, cx, by + bh * 0.6);

  // Button
  const btnW = W(0.3), btnH = H(0.1);
  const btnX = cx - btnW / 2, btnY = by + bh * 0.72;
  const pulse = 0.92 + 0.08 * Math.sin(Date.now() * 0.004);
  ctx.save();
  ctx.translate(cx, btnY + btnH / 2);
  ctx.scale(pulse, pulse);
  ctx.translate(-cx, -(btnY + btnH / 2));
  ctx.fillStyle = '#e94560';
  ctx.shadowColor = '#e94560';
  ctx.shadowBlur = 20;
  roundRect(btnX, btnY, btnW, btnH, 8);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.font = `bold ${W(0.03)}px 'Segoe UI', sans-serif`;
  ctx.fillStyle = '#fff';
  ctx.fillText('TAP / SPACE', cx, btnY + btnH / 2);
  ctx.restore();

  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
}

// --- Main Loop ---
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawGradientBg();
  drawStars();
  drawGround();

  platforms.forEach(drawPlatform);
  obstacles.forEach(drawObstacle);
  coinItems.forEach(drawCoin);
  drawParticles();

  if (state !== 'start') drawPlayer();
  if (state === 'play' || state === 'dead') drawHUD();

  if (state === 'start') {
    drawScreen('RUNNER', 'Tap or press SPACE to jump', 'Double jump available! Collect coins, avoid obstacles.');
  } else if (state === 'dead') {
    drawScreen(
      'GAME OVER',
      `Score: ${Math.floor(score / 6)}  •  Coins: ${coins}`,
      `Best: ${Math.floor(hiScore / 6)}  •  Best Coins: ${bestCoins}`
    );
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
